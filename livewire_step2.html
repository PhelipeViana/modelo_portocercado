    <script>
        window.addEventListener('localUpdated', function () {
            setTimeout(() => {
                const formElement = document.getElementById('form-container');
                if (formElement) {
                    const offset = formElement.offsetTop - 40; // Deixa um respiro no topo
                    window.scrollTo({
                        top: offset,
                        behavior: 'smooth'
                    });
                }
            }, 100);
        });

        window.addEventListener('aviso', function () {
            Swal.fire({
                title: 'Atenção!',
                text: 'Sua senha é muito importante, guarde-a bem. Não temos como recuperar sua senha.',
                icon: 'warning',
                confirmButtonColor: '#059669',
                confirmButtonText: 'Entendi e Concordo'
            }).then((result) => {
                if (result.isConfirmed) {
                    Livewire.dispatch('save');
                }
            });
        });

        const initReveal = () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        };

        document.addEventListener('DOMContentLoaded', initReveal);
        window.addEventListener('load', initReveal);
        initReveal(); // For initial state
    </script>
