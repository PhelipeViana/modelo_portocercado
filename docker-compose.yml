services:
  postgres:
    image: postgres:16-alpine
    container_name: portocercado2_postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-portocercado2}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-portocercado2_pass}
      - POSTGRES_DB=${DB_NAME:-portocercado2_db}
    volumes:
      - portocercado2_postgres_data:/var/lib/postgresql/data
    networks:
      - portocercado2_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-portocercado2} -d ${DB_NAME:-portocercado2_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: portocercado2_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - portocercado2_redis_data:/data
    networks:
      - portocercado2_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portocercado2_backend
    ports:
      - "8088:8080"
    environment:
      - PORT=8080
      - ENV=${ENV:-development}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-portocercado2}
      - DB_PASSWORD=${DB_PASSWORD:-portocercado2_pass}
      - DB_NAME=${DB_NAME:-portocercado2_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-portocercado2_super_secret_key_2026}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      - UPLOADS_DIR=/data/uploads
    volumes:
      - portocercado2_uploads:/data/uploads
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portocercado2_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portocercado2_frontend
    ports:
      - "3150:3000"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8088}
    depends_on:
      - backend
    networks:
      - portocercado2_network

  database-backup:
    image: postgres:16-alpine
    container_name: portocercado2_backup
    restart: unless-stopped
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${DB_USER:-portocercado2}
      - PGPASSWORD=${DB_PASSWORD:-portocercado2_pass}
      - PGDATABASE=${DB_NAME:-portocercado2_db}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/database-backup.sh:/usr/local/bin/database-backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/database-backup.sh", "schedule"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portocercado2_network

networks:
  portocercado2_network:
    driver: bridge

volumes:
  portocercado2_postgres_data:
  portocercado2_redis_data:
  portocercado2_uploads:
